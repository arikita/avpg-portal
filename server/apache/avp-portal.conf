<VirtualHost *:80>
    ServerName portal.anvietphatgroup.com
    Redirect permanent / https://portal.anvietphatgroup.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName  portal.anvietphatgroup.com
    ServerAlias internal.anvietphatgroup.com hcm-internalsvr.anvietphatgroup.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/avp/portal.crt
    SSLCertificateKeyFile /etc/ssl/avp/portal.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # =====================================================================
    # XAC THUC 3 DUONG (form them 19/08/2026, thay popup Basic cua trinh duyet)
    #   1. May JOIN DOMAIN            -> Negotiate/Kerberos, SSO im lang.
    #   2. May KHONG join domain      -> KHONG con popup Basic. Kerberos that bai
    #      => 401 => ErrorDocument tra TRANG DANG NHAP /dang-nhap/ (o ghi "Email").
    #      Form POST /dang-nhap/xac-thuc -> mod_auth_form + provider LDAP
    #      (avp-upn/avp-sam) -> phien luu trong cookie ma hoa "avpsess".
    #   3. Client tu gui Authorization: Basic (curl, script) -> van chay nhu cu.
    #
    #   Vi sao BO GssapiBasicAuth On: popup cua trinh duyet chi hien khi server
    #   gui WWW-Authenticate: Basic. Con dong do la con popup, du co trang login.
    #   (Nhan "Ten nguoi dung"/"Mat khau" trong popup do TRINH DUYET sinh theo
    #   ngon ngu may, server khong doi duoc - day la ly do lam trang login rieng.)
    #
    #   Vi sao Basic phai di LDAP chu khong dung GssapiBasicAuth:
    #     GssapiBasicAuth coi phan sau dau @ la KERBEROS REALM, nen
    #     andy@anvietenergy.com => "Cannot find KDC for realm anvietenergy.com".
    #     Ca cong ty dung UPN @anvietenergy.com nen duong do vo dung.
    #   LDAP simple bind nhan ca "andy", "andy@anvietenergy.com",
    #   "andy@anvietphatgroup.com" (24 nhan vien con dung hau to nay).
    #   AuthLDAPRemoteUserAttribute sAMAccountName => REMOTE_USER LUON la "andy",
    #   nho vay app/ad.py (regex chi cho [A-Za-z0-9._-]) va phan quyen IS/HR
    #   khong phai sua gi.
    # =====================================================================

    # ---- Phien dang nhap bang form (mod_session + mod_auth_form) ----
    # Cookie ma hoa bang passphrase o /etc/apache2/avp-session.key (chmod 600):
    # client KHONG doc va KHONG che duoc noi dung phien.
    Session On
    SessionCookieName avpsess path=/;HttpOnly;Secure;SameSite=Lax;Max-Age=43200
    SessionCryptoPassphraseFile /etc/apache2/avp-session.key
    SessionMaxAge 43200
    SessionExpiryUpdateInterval 600

    # WebSocket phai dang ky TRUOC ProxyPass cua /api: mod_proxy lay mapping
    # KHOP DAU TIEN trong file, khong phai khop dai nhat. Dat sau thi /api
    # nuot mat va chuyen tiep nhu HTTP thuong => backend tra 404.
    ProxyPass        /api/ws http://127.0.0.1:8000/api/ws upgrade=websocket
    ProxyPassReverse /api/ws http://127.0.0.1:8000/api/ws

    # ================= Trang dang nhap (KHONG doi xac thuc) =================
    # Dat ngoai DocumentRoot de khong dinh cac khoi <If> xac thuc ben duoi.
    Alias /dang-nhap /var/www/avp-login
    <Directory /var/www/avp-login>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex index.html
        AuthType None
        Require all granted
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
    </Directory>

    # Noi nhan POST cua form. Sai mat khau -> quay lai trang login kem ?loi=1.
    <Location /dang-nhap/xac-thuc>
        SetHandler form-login-handler
        AuthType form
        AuthName "AVP Portal"
        AuthFormProvider avp-upn avp-sam
        AuthFormLoginRequiredLocation "/dang-nhap/?loi=1"
        AuthFormLoginSuccessLocation "/"
        Session On
        Require all granted
    </Location>

    # Thoat / xoa phien hong roi ve trang dang nhap.
    <Location /dang-nhap/thoat>
        SetHandler form-logout-handler
        AuthType form
        AuthName "AVP Portal"
        AuthFormLogoutLocation "/dang-nhap/"
        Session On
        SessionMaxAge 1
        Require all granted
    </Location>

    # ================= API dong =================
    <Location /api>
        <If "%{HTTP:Cookie} =~ /avpsess=/">
            # Da dang nhap bang form. KHONG dat AuthFormLoginRequiredLocation:
            # API phai tra 401 cho fetch(), khong duoc chuyen huong ve trang HTML.
            AuthType form
            AuthName "AVP Portal"
            AuthFormProvider avp-upn avp-sam
            Session On
            Require valid-user
        </If>
        <ElseIf "%{HTTP:Authorization} =~ /^Basic/">
            AuthType Basic
            AuthName "An Viet Phat - dang nhap bang tai khoan domain"
            AuthBasicProvider avp-upn avp-sam
            Require valid-user
        </ElseIf>
        <Else>
            AuthType GSSAPI
            AuthName "An Viet Phat - dang nhap bang tai khoan domain"
            GssapiCredStore keytab:/etc/krb5.keytab.portal
            GssapiNegotiateOnce On
            GssapiAllowedMech krb5
            GssapiLocalName On
            Require valid-user
        </Else>
        # BAT BUOC: xoa header do client gui truoc, roi moi dat tu REMOTE_USER.
        # Thieu dong unset nay = bat ky ai cung mao danh duoc nguoi khac.
        RequestHeader unset X-Remote-User
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
        ProxyPass        http://127.0.0.1:8000/api
        ProxyPassReverse http://127.0.0.1:8000/api
    </Location>

    # ============== WebSocket cho chat ==============
    # Trinh duyet KHONG lam duoc Kerberos/Negotiate tren ban bat tay WebSocket
    # (khong dat duoc header, gap 401 la hong ket noi). Nen duong nay KHONG
    # doi xac thuc o Apache: backend tu kiem "ve" dung-mot-lan do chinh
    # /api/chat/ws-ticket phat ra (duong do VAN qua Kerberos/form). Xem app/chat.py.
    #
    # VAN xoa X-Remote-User client gui len: khong ai mao danh duoc qua day.
    # Khoi nay dat SAU <Location /api> de ghi de ProxyPass cho dung URL nay.
    <Location /api/ws>
        # Boc trong <If> vi Apache gop cac khoi <If> sau cung: khong boc thi
        # `Require valid-user` trong <Else> cua /api van de len day.
        <If "true">
            AuthType None
            Require all granted
        </If>
        RequestHeader unset X-Remote-User
        # (Anh xa proxy nam o tren, truoc khoi /api — xem giai thich o do.)
    </Location>

    # ============== Anh tin tuc (upload) ==============
    # Angular xuat font ra /media cua chinh no -> phai nhuong truoc,
    # khong thi Alias ben duoi nuot het (font 404, chu roi ve font du phong).
    AliasMatch "^/media/(inter-[^/]+\.(?:woff2?|css))$" /var/www/avp-portal/media/$1
    Alias /media /var/www/avp-portal-media
    <Directory /var/www/avp-portal-media>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        <If "%{HTTP:Cookie} =~ /avpsess=/">
            AuthType form
            AuthName "AVP Portal"
            AuthFormProvider avp-upn avp-sam
            AuthFormLoginRequiredLocation "/dang-nhap/thoat"
            Session On
            Require valid-user
        </If>
        <ElseIf "%{HTTP:Authorization} =~ /^Basic/">
            AuthType Basic
            AuthName "An Viet Phat - dang nhap bang tai khoan domain"
            AuthBasicProvider avp-upn avp-sam
            Require valid-user
        </ElseIf>
        <Else>
            AuthType GSSAPI
            AuthName "An Viet Phat - dang nhap bang tai khoan domain"
            GssapiCredStore keytab:/etc/krb5.keytab.portal
            GssapiNegotiateOnce On
            GssapiAllowedMech krb5
            GssapiLocalName On
            Require valid-user
        </Else>
    </Directory>

    DocumentRoot /var/www/avp-portal
    <Directory /var/www/avp-portal>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        FallbackResource /index.html
        # Chua dang nhap (khong ve Kerberos, khong phien form) -> thay vi popup
        # cua trinh duyet thi tra thang TRANG DANG NHAP cua portal.
        ErrorDocument 401 /dang-nhap/index.html
        # index.html = ban do tro toi chunk co ma bam => KHONG duoc cache,
        # neu khong trinh duyet se chay ban cu ma khong bao loi gi.
        <Files "index.html">
            Header always set Cache-Control "no-cache, no-store, must-revalidate"
        </Files>
        # Nguoc lai: file co ma bam thi doi noi dung la doi ten => cache lau duoc.
        <FilesMatch "-[A-Z0-9]{8}\.(js|css)$">
            Header always set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <If "%{HTTP:Cookie} =~ /avpsess=/">
            # Phien hong/het han -> /dang-nhap/thoat xoa cookie roi ve trang login,
            # nho vay may join domain quay lai duoc duong SSO Kerberos.
            AuthType form
            AuthName "AVP Portal"
            AuthFormProvider avp-upn avp-sam
            AuthFormLoginRequiredLocation "/dang-nhap/thoat"
            Session On
            Require valid-user
        </If>
        <ElseIf "%{HTTP:Authorization} =~ /^Basic/">
            AuthType Basic
            AuthName "An Viet Phat - dang nhap bang tai khoan domain"
            AuthBasicProvider avp-upn avp-sam
            Require valid-user
        </ElseIf>
        <Else>
            AuthType GSSAPI
            AuthName "An Viet Phat - dang nhap bang tai khoan domain"
            GssapiCredStore keytab:/etc/krb5.keytab.portal
            GssapiNegotiateOnce On
            GssapiAllowedMech krb5
            GssapiLocalName On
            Require valid-user
        </Else>
    </Directory>
</VirtualHost>
