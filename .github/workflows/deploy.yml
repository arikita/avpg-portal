name: Deploy Portal
on:
  push:
    branches: [ main ] # Tự động chạy khi bạn push code lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/dksvr/Documents/portal
            git pull origin main